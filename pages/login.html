<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body>
    <%- include('./layout/navbar'); -%>

    <main class="log-in">
      <!-- 響應式背景圖 -->
      <div class="d-none d-md-block">
        <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login-sm.png?raw=true" alt="logo照片">
      </div>
      <div class="container">
        <div class="row">
          <div class="col-5 d-md-none">
            <!-- 背景圖 -->
            <div class="bg-img"></div>
          </div>
          <div class="col-7 col-md-4">
            <!-- 背景圖 -->
            <div class="bg-img">
              <!-- 登入欄位 -->
              <div class="login-box">
                <h1 class="h3 h4-md mb-32 mb-md-24">歡迎！</h1>
                <table class="login-table mb-32 mb-md-24">
                  <tr>
                    <th class="h6 active"><a href="login.html">登入</a></th>
                    <th class="h6"><a href="signup.html">註冊</a></th>
                  </tr>
                </table>
                <div class="form mb-8">
                  <a class="d-flex ai-center" href="#">
                    <img class="mr-12" src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/8719e07a34f05b853e98e1402ed748446fdd8ef3/2025-week3-4/facebook.svg" alt="臉書帳號登入">
                    <p class="fw-400">Facebook 登入</p>
                  </a>
                </div>
                <div class="form mb-8">
                  <a class="d-flex ai-center" href="#">
                    <img class="mr-12" src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/8719e07a34f05b853e98e1402ed748446fdd8ef3/2025-week3-4/apple.svg" alt="蘋果帳號登入">
                    <p class="fw-400">Apple 登入</p>
                  </a>
                </div>
                <div class="form mb-8">
                  <a class="d-flex ai-center" href="#">
                    <img class="mr-12" src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/8719e07a34f05b853e98e1402ed748446fdd8ef3/2025-week3-4/google.svg" alt="Google帳號登入">
                    <p class="fw-400">Google 登入</p>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
